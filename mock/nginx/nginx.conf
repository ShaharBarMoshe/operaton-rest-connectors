# Stateful REST mock for the Operaton REST connectors (nginx + njs).
load_module modules/ngx_http_js_module.so;

worker_processes 1;
events { worker_connections 256; }

http {
  js_path "/etc/nginx/njs/";
  js_import mock from mock.js;

  # in-memory state shared by all requests (users, contacts, recorded calls)
  js_shared_dict_zone zone=mock:2m type=string;

  log_format mock '$remote_addr "$request" $status body=$request_body';
  access_log /dev/stdout mock;

  server {
    listen 8080;

    client_max_body_size 1m;
    client_body_buffer_size 1m;      # keep bodies in memory so njs can read them
    client_body_in_single_buffer on;

    location = /health { default_type text/plain; return 200 "ok\n"; }

    # /api/...      → mocked user service
    # /__mock/calls → GET: recorded calls, DELETE: reset state
    location / {
      default_type application/json;
      js_content mock.handle;
    }
  }
}
