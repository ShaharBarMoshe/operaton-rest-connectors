openapi: 3.0.3
info:
  title: Customer API (mock)
  version: 1.0.0
  description: >
    The services the customer-snapshot process calls, as served by the nginx mock
    (GET /openapi.yaml). Copy schemas and parameters from here into the connector tasks.
servers:
  - url: http://localhost:8081/api
security:
  - bearerAuth: []
paths:
  /customers/{customerId}/profile:
    get:
      operationId: getProfile
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The customer's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401': {description: Bearer token missing or malformed}
        '404': {description: No such customer}
  /customers/{customerId}/contact:
    get:
      operationId: getContact
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: How to reach the customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
  /customers/{customerId}/address:
    get:
      operationId: getAddress
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Postal address
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: {$ref: '#/components/schemas/Address'}
  /customers/{customerId}/account:
    get:
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: {$ref: '#/components/schemas/Account'}
  /customers/{customerId}/loyalty:
    get:
      operationId: getLoyalty
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Loyalty programme
          content:
            application/json:
              schema:
                type: object
                properties:
                  loyalty: {$ref: '#/components/schemas/Loyalty'}
                  account:
                    type: object
                    properties:
                      tier: {type: string}
  /customer-snapshots:
    post:
      operationId: createSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSnapshot'
      responses:
        '201':
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSnapshot'
        '400': {description: Not a JSON body}
        '401': {description: Bearer token missing or malformed}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    ProfileResponse:
      type: object
      properties:
        customer:
          type: object
          properties:
            id: {type: integer, format: int64}
            firstName: {type: string}
            lastName: {type: string}
            birthDate: {type: string, format: date}
            internalNotes: {type: string}
    ContactResponse:
      type: object
      properties:
        customer:
          type: object
          properties:
            email: {type: string, format: email}
            phone: {type: string}
    Address:
      type: object
      required: [city, country]
      properties:
        street: {type: string}
        city: {type: string}
        zip: {type: string}
        country: {type: string, minLength: 2, maxLength: 2, example: IL}
    Account:
      type: object
      required: [status, tier]
      properties:
        status: {type: string, enum: [active, suspended, closed]}
        tier: {type: string, enum: [silver, gold, platinum]}
    Loyalty:
      type: object
      properties:
        points: {type: integer, format: int32}
        level: {type: string}
    CustomerSnapshot:
      type: object
      required: [id, customerId, name, contact, address, account, loyalty]
      properties:
        id:
          type: string
          readOnly: true
          pattern: '^s-[0-9]+$'
          example: s-17
        customerId:
          type: integer
          format: int64
        name:
          type: object
          required: [first, last]
          properties:
            first: {type: string}
            last: {type: string}
        birthDate:
          type: string
          format: date
          nullable: true
        contact:
          type: object
          required: [email]
          properties:
            email: {type: string, format: email}
            phone: {type: string}
        address:
          $ref: '#/components/schemas/Address'
        account:
          $ref: '#/components/schemas/Account'
        loyalty:
          $ref: '#/components/schemas/Loyalty'
        snapshotBy:
          type: string
          default: system
